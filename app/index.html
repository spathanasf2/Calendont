<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A bloat-free calendar that doesn't invade your privacy or sell you features.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendont">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Calendont</title>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="nav">
        <button type="button" class="icon-btn" data-action="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="title" data-action="jump" aria-label="Jump to a date">
          <span id="title-main">Calendont</span> <span id="title-sub"></span>
        </button>
        <button type="button" class="icon-btn" data-action="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <input type="date" id="jump" class="visually-hidden" tabindex="-1" aria-hidden="true">
      </div>
      <div class="tools">
        <button type="button" class="pill-btn" data-action="today">Today</button>
        <div class="segmented wide-only" role="group" aria-label="View">
          <button type="button" data-view="day" aria-pressed="false">Day</button>
          <button type="button" data-view="week" aria-pressed="false">Week</button>
          <button type="button" data-view="month" aria-pressed="false">Month</button>
          <button type="button" data-view="list" aria-pressed="false">List</button>
        </div>
        <button type="button" class="icon-btn wide-only" data-action="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
        <button type="button" class="add-btn" data-action="new" aria-label="New event">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="wide-only">New</span>
        </button>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="tabbar compact-only" aria-label="View">
      <div class="segmented" role="group">
        <button type="button" data-view="day" aria-pressed="false">Day</button>
        <button type="button" data-view="week" aria-pressed="false">Week</button>
        <button type="button" data-view="month" aria-pressed="false">Month</button>
        <button type="button" data-view="list" aria-pressed="false">List</button>
      </div>
      <button type="button" class="icon-btn" data-action="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-label="Details"></dialog>
  <dialog id="prompt" class="prompt" aria-label="Choose"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>
  <div class="drop-hint" aria-hidden="true">Drop a backup or .ics file to import it</div>

  <noscript><p class="noscript">Calendont needs JavaScript to run. Everything stays on your device.</p></noscript>
</body>
</html>
